name: lambda-fleet

x-airflow-common: &airflow-common
  build: ./airflow
  image: lambda-fleet-airflow:2.10.5
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    HADOOP_USER_NAME: root
    CASSANDRA_HOST: cassandra
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./spark/jobs:/opt/jobs
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

x-spark-job: &spark-job
  image: apache/spark:3.5.6-python3
  environment: &spark-env
    KAFKA_BOOTSTRAP: kafka:29092
    KAFKA_TOPIC: vehicle.telemetry
    HDFS_URL: hdfs://namenode:8020
    CASSANDRA_HOST: cassandra
    HADOOP_USER_NAME: root
  volumes:
    - ./spark/jobs:/opt/jobs
  restart: on-failure

services:
  # ───────────── Metadata DB (Airflow) ─────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # ───────────── Kafka stack ─────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 2181"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      zookeeper: {condition: service_healthy}
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      #KAFKA_METRIC_REPORTERS: io.confluent.metrics.reporter.ConfluentMetricsReporter
      #CONFLUENT_METRICS_REPORTER_BOOTSTRAP_SERVERS: kafka:29092
      #CONFLUENT_METRICS_REPORTER_TOPIC_REPLICAS: 1
      #CONFLUENT_METRICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server kafka:29092 --list"]
      interval: 10s
      retries: 15
      start_period: 20s

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka: {condition: service_healthy}
    command: >
      bash -c "kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists
      --topic vehicle.telemetry --partitions 3 --replication-factor 1"
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka: {condition: service_healthy}
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.6.1
    depends_on:
      kafka: {condition: service_healthy}
      schema-registry: {condition: service_started}
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: kafka:29092
      CONTROL_CENTER_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      PORT: 9021

  # ───────────── Serving DB : Cassandra ─────────────
  cassandra:
    image: cassandra:5.0
    ports:
      - "9042:9042"
    environment:
      CASSANDRA_CLUSTER_NAME: fleet-cluster
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces'"]
      interval: 15s
      retries: 20
      start_period: 60s

  cassandra-init:
    image: cassandra:5.0
    depends_on:
      cassandra: {condition: service_healthy}
    volumes:
      - ./cassandra/schema.cql:/schema.cql:ro
    command: ["cqlsh", "cassandra", "-f", "/schema.cql"]
    restart: "no"

  # ───────────── Hadoop / HDFS (Batch layer storage) ─────────────
  namenode:
    image: apache/hadoop:3.3.6
    hostname: namenode
    command: ["hdfs", "namenode"]
    ports:
      - "9870:9870"
    env_file: ./hadoop/hadoop.env
    environment:
      ENSURE_NAMENODE_DIR: /tmp/hadoop-hadoop/dfs/name
    volumes:
      - namenode-data:/tmp/hadoop-hadoop/dfs/name

  datanode:
    image: apache/hadoop:3.3.6
    command: ["hdfs", "datanode"]
    env_file: ./hadoop/hadoop.env
    depends_on:
      - namenode
    volumes:
      - datanode-data:/tmp/hadoop-hadoop/dfs/data

  hdfs-init:
    image: apache/hadoop:3.3.6
    env_file: ./hadoop/hadoop.env
    depends_on:
      - namenode
      - datanode
    command: >
      bash -c "until hdfs dfsadmin -report 2>/dev/null | grep -q 'Live datanodes (1)'; do echo waiting for HDFS; sleep 5; done;
      hdfs dfs -mkdir -p /lambda/raw/telemetry /lambda/checkpoints &&
      hdfs dfs -chmod -R 777 /lambda && echo HDFS ready"
    restart: "no"

  # ───────────── Speed layer + ingestion (Spark Structured Streaming) ─────────────
  spark-ingest:
    <<: *spark-job
    ports:
      - "4040:4040"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      cassandra-init: {condition: service_completed_successfully}
      hdfs-init: {condition: service_completed_successfully}
    command: >
      /opt/spark/bin/spark-submit --master local[4]
      --conf spark.jars.ivy=/tmp/ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      /opt/jobs/ingest.py

  spark-speed:
    <<: *spark-job
    ports:
      - "4041:4040"
    depends_on:
      kafka-init: {condition: service_completed_successfully}
      cassandra-init: {condition: service_completed_successfully}
      hdfs-init: {condition: service_completed_successfully}
    command: >
      /opt/spark/bin/spark-submit --master local[2]
      --conf spark.jars.ivy=/tmp/ivy
      --packages org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.6,com.datastax.spark:spark-cassandra-connector_2.12:3.5.1
      /opt/jobs/speed_layer.py

  # ───────────── Batch orchestration (Airflow) ─────────────
  airflow-init:
    <<: *airflow-common
    command: >
      bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname a --lastname b --role Admin --email admin@example.com"
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      hdfs-init: {condition: service_completed_successfully}
      cassandra-init: {condition: service_completed_successfully}

  # ───────────── Data source ─────────────
  producer:
    build: ./producer
    depends_on:
      kafka-init: {condition: service_completed_successfully}
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC: vehicle.telemetry
      MODE: csv                  # simulator | csv
      N_VEHICLES: 14             # fallback si VEHICLE_ID est absent
      EVENTS_PER_SECOND: 20
      LOOP: "true"
      CSV_PATH: /data/vehicles.csv
      MAPPING_PATH: /app/mapping.json
    volumes:
      - ./data:/data:ro
    restart: on-failure

  # ───────────── Serving layer API ─────────────
  serving-api:
    build: ./serving
    depends_on:
      cassandra-init: {condition: service_completed_successfully}
    environment:
      CASSANDRA_HOST: cassandra
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  cassandra-data:
  namenode-data:
  datanode-data:
  airflow-logs:
